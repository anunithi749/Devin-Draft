<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}The Devin Draft{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('main.index') }}">
      <span class="brand-mark">◆</span>
      THE DEVIN DRAFT
    </a>
    <nav class="nav">
      <a href="{{ url_for('main.index') }}">Dashboard</a>
      <a href="{{ url_for('main.board') }}">Draft Board</a>
      <a href="{{ url_for('main.submit') }}">Log an entry</a>
      <a href="{{ url_for('main.review') }}">Review</a>
    </nav>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <footer class="foot">
    Season 1 · The Founding Five · a gamified AI-upskilling tracker
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
